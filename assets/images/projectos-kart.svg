    <g fill="#b1c6d9" font-size="18"><text x="75" y="215">Devam ediyor</text><text x="75" y="308">Planlama</text><text x="75" y="401">Beklemede</text></g>
    <g fill="#e5edf3" font-size="23"><text x="452" y="198">Görevler ve ilerleme</text><text x="452" y="266">Oturum notları</text><text x="452" y="334">AI bağlam özeti</text><text x="452" y="402">Yedekleme yaklaşımı</text></g>
